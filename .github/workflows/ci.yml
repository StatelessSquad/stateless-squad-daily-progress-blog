name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks via its official image: free for organizations (gitleaks-action needs a paid license for orgs)
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner --exit-code 1
  lint-and-test:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate activity-log entries (schema, public links only, no secrets or internal info)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_entries.py --check-public
      - run: npm ci
      - run: npm run build
      - name: Check the built page has styles and base-path assets
        run: |
          test -n "$(ls dist/_astro/*.css 2>/dev/null)" || { echo "no CSS emitted"; exit 1; }
          grep -q '/stateless-squad-daily-progress-blog/favicon.svg' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ./dist
  deploy:
    # only main deploys; PRs build and test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
